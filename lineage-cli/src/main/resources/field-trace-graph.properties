# 作用：CLI 的内置默认配置。
# 使用场景：未通过命令行参数或环境变量覆盖时提供出厂默认值。
# Built-in defaults for the local field-lineage CLI. Values here are the
# lowest-priority source; explicit CLI options and the whitelisted environment
# variables listed in ToolConfigurationLoader take precedence.
