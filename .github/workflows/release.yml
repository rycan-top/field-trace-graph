name: release

# Builds the four platform archives, fills the release manifest with their
# hashes, runs the fail-closed verification gate, publishes the GitHub release,
# and finally publishes the npm launcher.
#
# Required repository secret:
#   NPM_TOKEN  - npm automation token with publish rights for the package
#
# The `GITHUB_TOKEN` secret is provided by Actions and needs `contents: write`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pom.xml and both manifests)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, cpu: arm64, runner: macos-latest }
          # GitHub retired macos-13 on 2025-12-04; macos-15-intel is the
          # current x86_64 macOS runner label.
          - { os: darwin, cpu: x64, runner: macos-15-intel }
          - { os: linux, cpu: x64, runner: ubuntu-latest }
          - { os: win32, cpu: x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build release archive
        shell: bash
        env:
          FTG_STRICT_RELEASE: "1"
        run: |
          set -euo pipefail
          FTG_JAVA_HOME="$JAVA_HOME" \
          FTG_RUNTIME_HOME="$JAVA_HOME" \
          VERSION="$RELEASE_VERSION" \
          OS="${{ matrix.os }}" \
          CPU="${{ matrix.cpu }}" \
          bash distribution/build-release.sh

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.cpu }}
          path: distribution/build/field-trace-graph-*
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/field-trace-graph-sbom.json
          if-no-files-found: error

  release:
    name: verify and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          pom="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          manifest="$(node -p 'require("./distribution/release-manifest.json").version')"
          pkg="$(node -p 'require("./distribution/npm/package.json").version')"
          echo "pom=$pom manifest=$manifest npm=$pkg tag=$RELEASE_VERSION"
          [ "$pom" = "$RELEASE_VERSION" ] || { echo "pom.xml version mismatch" >&2; exit 1; }
          [ "$manifest" = "$RELEASE_VERSION" ] || { echo "release-manifest version mismatch" >&2; exit 1; }
          [ "$pkg" = "$RELEASE_VERSION" ] || { echo "npm package version mismatch" >&2; exit 1; }

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: distribution/build
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: target

      - name: Fill manifest hashes
        shell: bash
        run: |
          set -euo pipefail
          node -e '
          const m = require("./distribution/release-manifest.json");
          for (const p of m.platforms) console.log(`${p.os} ${p.cpu} ${p.archive}`);
          ' | while read -r os cpu archive; do
            if [ ! -f "distribution/build/$archive" ]; then
              echo "missing archive: $archive" >&2
              exit 1
            fi
            sum="$(sha256sum "distribution/build/$archive" | awk '{print $1}')"
            node distribution/update-release-manifest.js "$os" "$cpu" "$archive" "$sum"
            echo "$os-$cpu: $sum"
          done

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run release gate
        run: distribution/verify-release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            distribution/build/field-trace-graph-*
            distribution/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        working-directory: distribution/npm
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm publish --access public
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
